<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="252" viewBox="0 0 1200 252"
     role="img" aria-labelledby="title desc">
  <title id="title">How JSONTitan stays responsive</title>
  <desc id="desc">Pipeline: the file is read and parsed with simdjson into a single
  memory arena on a worker thread; the UI thread only ever materializes tree rows
  lazily, 100 at a time.</desc>

  <rect width="1200" height="252" rx="16" fill="#1e1e2e"/>
  <rect x="0.75" y="0.75" width="1198.5" height="250.5" rx="15.25"
        fill="none" stroke="#45475a" stroke-width="1.5"/>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6c7086"/>
    </marker>
  </defs>

  <!-- Thread boundary -->
  <line x1="836" y1="24" x2="836" y2="196" stroke="#45475a" stroke-width="1.5"
        stroke-dasharray="7 7"/>
  <text x="820" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#6c7086" text-anchor="end">worker thread, cancellable at any point</text>
  <text x="852" y="228" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" fill="#6c7086">UI thread</text>

  <!-- Stage 1: file -->
  <g transform="translate(48 60)">
    <rect width="200" height="104" rx="10" fill="#181825" stroke="#45475a" stroke-width="1.5"/>
    <text x="100" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="22" fill="#cdd6f4" text-anchor="middle">massive.json</text>
    <text x="100" y="76" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="19" fill="#a6e3a1" text-anchor="middle">2.1 GB on disk</text>
  </g>
  <line x1="252" y1="112" x2="300" y2="112" stroke="#6c7086" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 2: simdjson -->
  <g transform="translate(306 60)">
    <rect width="230" height="104" rx="10" fill="#181825" stroke="#89b4fa" stroke-width="1.5"/>
    <text x="115" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="22" fill="#89b4fa" text-anchor="middle">simdjson</text>
    <text x="115" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="19" fill="#a6adc8" text-anchor="middle">SIMD parse, GB/s</text>
  </g>
  <line x1="540" y1="112" x2="588" y2="112" stroke="#6c7086" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 3: arena -->
  <g transform="translate(594 60)">
    <rect width="218" height="104" rx="10" fill="#181825" stroke="#fab387" stroke-width="1.5"/>
    <text x="109" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="22" fill="#fab387" text-anchor="middle">arena tree</text>
    <text x="109" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="19" fill="#a6adc8" text-anchor="middle">one pool, zero per-node</text>
  </g>
  <line x1="816" y1="112" x2="864" y2="112" stroke="#6c7086" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Stage 4: lazy tree -->
  <g transform="translate(870 60)">
    <rect width="282" height="104" rx="10" fill="#181825" stroke="#a6e3a1" stroke-width="1.5"/>
    <text x="141" y="44" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"
          font-size="22" fill="#a6e3a1" text-anchor="middle">lazy Qt tree</text>
    <text x="141" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif"
          font-size="19" fill="#a6adc8" text-anchor="middle">rows appear 100 at a time</text>
  </g>
</svg>
